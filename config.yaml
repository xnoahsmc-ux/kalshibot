# Kalshibot v2 configuration. Secrets remain in .env.
universe:
  max_spread_cents: 4
  min_volume_usd_24h: 500
  min_time_to_resolution_minutes: 60
  max_time_to_resolution_minutes: 20160          # 14 days
  min_open_interest: 100

signals:
  min_edge_cents: 3
  min_confidence: 0.55
  weights:                                       # logistic stacker priors;
    mispricing: 1.0                              # online learner adjusts post-fit
    microstructure: 0.6
    external_anchor: 1.4

execution:
  passive_inset_cents: 1                          # tightest passive limit
  escalate_after_seconds: 30                      # passive -> mid
  take_if_edge_cents: 5                           # cross spread if edge >= 5c
  watchdog_timeout_seconds: 60                    # flatten if API unreachable
  rate_limit_qps: 8

risk:
  kelly_fraction: 0.25                            # quarter-Kelly
  hard_max_per_contract_usd: 25                   # 2-week ramp ceiling
  daily_loss_limit_pct: 3.0                       # 3% of bankroll
  max_concurrent_positions: 12
  max_per_genre: 4
  max_same_series: 3
  halt_flag_path: data/HALT

storage:
  snapshots_db: data/markets.db
  paper_ledger: data/paper_ledger.jsonl
  live_journal: data/journal.jsonl

backtest:
  fee_cents_per_trade: 7
  slippage_cents: 0                               # added to half-spread
  queue_position_assumption: 0.5                  # we land mid-queue

monitoring:
  log_dir: logs
  cli_dashboard: true
  discord_webhook_url: ""                         # off by default
  slack_webhook_url: ""                           # off by default
