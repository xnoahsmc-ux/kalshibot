[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshibot"
version = "0.1.0"
description = "Multi-strategy ensemble trading bot for Kalshi event markets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "flask>=3.0",
    "jinja2>=3.1",
]

[project.scripts]
kalshibot = "kalshibot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
